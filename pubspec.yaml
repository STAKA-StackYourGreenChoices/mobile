name: staka
description: STAKA mobile app for Android and iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# Packages are added in the slice that first uses them (guide §2).
dependencies:
  cached_network_image: ^4.0.7
  cupertino_ui: ^1.1.6
  dio: ^5.11.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: any
  json_annotation: ^4.12.0
  material_ui: ^1.11.0
  mobile_scanner: ^7.5.0
  riverpod_annotation: ^4.0.8

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # The welcome hero's sample tag photo, copied from the website's
    # public/catalog-images (a seeded product), so launch needs no network.
    - assets/images/

  # Vendored, never fetched at runtime (guide §6.2). OFL licences sit beside them.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
